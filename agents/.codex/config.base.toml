# Public Codex defaults. install.sh merges this with the private overlay (codex-config.toml)
# into ~/.codex/config.toml, which is generated and not stowed. Keep machine paths and
# project trust out of here.

personality = "pragmatic"
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
# Compact long sessions early (replaces the model default; clamped to 90% of the window).
model_auto_compact_token_limit = 150000
# Truncate each tool output to this many tokens (model default is 10000).
tool_output_token_limit = 7000

[mcp_servers.context7]
# The key comes from the git-ignored ~/.zsh/secrets/secrets.zsh at server start; never put it here.
command = "/bin/zsh"
args = ["-lc", "source \"$HOME/.zsh/secrets/secrets.zsh\" && CONTEXT7_API_KEY=\"$CONTEXT7_API_KEY\" exec npx -y @upstash/context7-mcp"]

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.langchain-docs]
url = "https://docs.langchain.com/mcp"

[mcp_servers.langchain-docs.tools.query_docs_filesystem_docs_by_lang_chain]
approval_mode = "approve"

[mcp_servers.langchain-docs.tools.search_docs_by_lang_chain]
approval_mode = "approve"

[mcp_servers.langsmith]
url = "https://eu.api.smith.langchain.com/mcp"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

# rastro: read-only search and coverage over the owner's evidence, installed by
# `cargo install --locked --path crates/rastro-cli` from a rastro-ai checkout.
[mcp_servers.rastro]
command = "sh"
args = ["-c", "exec \"$HOME/.cargo/bin/rastro\" mcp"]

# agent-runtime: shims installed by agent-runtime/install.sh into ~/.local/bin.
[mcp_servers.agent-runtime]
command = "sh"
args = ["-c", "exec \"$HOME/.local/bin/agent-runtime-mcp\""]
env_vars = ["HC_TERMINAL_ID", "HC_SCOPE", "HC_TERMINAL_SOCKET", "HERDR_PANE_ID", "HERDR_ENV", "HERDR_SOCKET_PATH", "HERDR_SESSION"]
default_tools_approval_mode = "auto"
tool_timeout_sec = 600

[mcp_servers.agent-runtime.env]
AGENT_RUNTIME_DISPATCH = "1"

[mcp_servers.agent-runtime.tools.spawn]
output_token_limit = 524288
approval_mode = "approve"

[mcp_servers.agent-runtime.tools.message]
output_token_limit = 524288
approval_mode = "approve"

[mcp_servers.agent-runtime.tools.resume]
output_token_limit = 524288
approval_mode = "approve"

[mcp_servers.agent-runtime.tools.stop]
output_token_limit = 524288
approval_mode = "approve"

[mcp_servers.agent-runtime.tools.report]
output_token_limit = 524288
approval_mode = "approve"

[mcp_servers.agent-runtime.tools.wait]
output_token_limit = 524288

[mcp_servers.agent-runtime.tools.status]
output_token_limit = 524288

[mcp_servers.agent-runtime.tools.list]
output_token_limit = 524288

[mcp_servers.agent-runtime.tools.collect]
output_token_limit = 524288

[mcp_servers.agent-runtime.tools.task]
output_token_limit = 524288
approval_mode = "approve"

[features]
hooks = true
js_repl = false

[sandbox_workspace_write]
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
network_access = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "\"$HOME/.local/bin/agent-runtime-hook\" --cli codex"
timeout = 5
statusMessage = "Checking hc command"

[[hooks.PreToolUse]]
matcher = "^mcp__agent-runtime__.*$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "\"$HOME/.local/bin/agent-runtime-hook\" --cli codex"
timeout = 5
statusMessage = "Checking agent-runtime caller"

# agent-runtime lead-liveness hooks: block a lead's Stop while it has unseen worker
# results, and remind it after compact/clear and on each prompt. Trust them via /hooks.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "\"$HOME/.local/bin/agent-runtime-hook\" stop --cli codex"
timeout = 5
statusMessage = "Checking for unseen worker results"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "\"$HOME/.local/bin/agent-runtime-hook\" context --cli codex"
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "\"$HOME/.local/bin/agent-runtime-hook\" context --cli codex"
timeout = 5
