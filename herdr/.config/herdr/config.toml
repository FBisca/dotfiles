onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[theme]
name = "one-dark"
auto_switch = false

# fleet visibility: in-app toasts + fleet run status tokens in the Spaces sidebar
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$brief", "$triage"],
  ["$coordinator", "$weekly-review"],
  ["$scribe"],
]
